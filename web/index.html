<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Company Brain</title>
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="stylesheet" href="./globals.css" />
    <script>
      (function () {
        var r = document.documentElement, p = "system";
        try { p = localStorage.getItem("theme-pref") || "system"; } catch (e) {}
        var dark = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        r.dataset.theme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = dark ? "#16181b" : "#f6f7f9";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
