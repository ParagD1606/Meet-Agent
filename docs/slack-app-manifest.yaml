# Production Slack manifest for Company Brain at https://slack.derpx06.live.
# Socket Mode is enabled: Slack events and interactive actions use the app-level token; leave Request URL fields empty.
# Apply this file in Slack API > Your Apps > Company Brain > App Manifest. Confirm both OAuth redirect URLs below.
# Never put Slack tokens, client secrets, or signing secrets in this file; configure those in the server environment.
# Scopes and events are maintained in server/src/slack/manifest.ts.
display_information:
  name: "Company Brain"
  description: "A teammate with shared memory that lives in your Slack."
  background_color: "#000b36"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: "Pixel"
    always_online: true
  slash_commands:
    -
      command: "/remember"
      description: "Save a fact to memory"
      usage_hint: "[something worth remembering]"
      should_escape: true
    -
      command: "/forget"
      description: "Find and delete memories"
      usage_hint: "[what to forget]"
      should_escape: true
    -
      command: "/whatdoyouknow"
      description: "See what I remember"
      usage_hint: "[@person or topic]"
      should_escape: true
    -
      command: "/brain-review"
      description: "Review pending memory changes (admins)"
      should_escape: true
    -
      command: "/brain-tasks"
      description: "Your open tasks and the ones you assigned"
      should_escape: true
    -
      command: "/brain-followups"
      description: "List, cancel and set up follow-up and digest DMs"
      usage_hint: "[list | cancel <id> | digest on 09:00 | weekly on]"
      should_escape: true
    -
      command: "/brain-new"
      description: "Start a fresh chat (forget this conversation's history, keep memory)"
      should_escape: true
    -
      command: "/brain-pause"
      description: "Stop learning from this channel (admins, channel creator)"
      should_escape: true
    -
      command: "/brain-resume"
      description: "Resume learning from this channel (admins, channel creator)"
      should_escape: true
    -
      command: "/repos"
      description: "List your connected GitHub repositories"
      usage_hint: "[page]"
      should_escape: true
oauth_config:
  redirect_urls:
    - "https://slack.derpx06.live/slack/oauth/callback"
    - "https://slack.derpx06.live/auth/slack/callback"
  scopes:
    user:
      - "openid"
      - "profile"
      - "email"
    bot:
      - "app_mentions:read"
      - "assistant:write"
      - "channels:history"
      - "channels:join"
      - "channels:manage"
      - "channels:read"
      - "chat:write"
      - "chat:write.public"
      - "canvases:read"
      - "commands"
      - "files:read"
      - "groups:history"
      - "groups:read"
      - "im:history"
      - "im:read"
      - "im:write"
      - "mpim:history"
      - "mpim:read"
      - "reactions:read"
      - "reactions:write"
      - "users:read"
      - "users:read.email"
      - "team:read"
      - "search:read.public"
      - "search:read.private"
      - "search:read.mpim"
      - "search:read.im"
settings:
  event_subscriptions:
    bot_events:
      - "app_mention"
      - "app_home_opened"
      - "message.channels"
      - "message.groups"
      - "message.im"
      - "message.mpim"
      - "member_joined_channel"
      - "member_left_channel"
      - "channel_left"
      - "group_left"
      - "channel_rename"
      - "channel_archive"
      - "channel_unarchive"
      - "channel_deleted"
      - "team_join"
      - "user_change"
      - "reaction_added"
      - "file_created"
      - "file_shared"
      - "file_change"
      - "assistant_thread_started"
      - "assistant_thread_context_changed"
      - "tokens_revoked"
      - "app_uninstalled"
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
