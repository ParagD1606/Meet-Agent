# Production Slack manifest for Company Brain at https://slack.derpx06.live.
# Socket Mode is enabled: Slack events and interactive actions use the app-level token; leave Request URL fields empty.
# Apply this file in Slack API > Your Apps > Company Brain > App Manifest. Confirm both OAuth redirect URLs below.
# Never put Slack tokens, client secrets, or signing secrets in this file; configure those in the server environment.
# Scopes and events are maintained in server/src/slack/manifest.ts.
display_information:
  name: "Company Brain"
  description: "A teammate with shared memory that lives in your Slack."
  background_color: "#000b36"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: "Company Brain"
    always_online: true
oauth_config:
  redirect_urls:
    - "https://slack.derpx06.live/slack/oauth/callback"
    - "https://slack.derpx06.live/auth/slack/callback"
  scopes:
    user:
      - "openid"
      - "profile"
      - "email"
    bot:
      - "app_mentions:read"
      - "assistant:write"
      - "channels:history"
      - "channels:join"
      - "channels:manage"
      - "channels:read"
      - "chat:write"
      - "chat:write.public"
      - "files:read"
      - "groups:history"
      - "groups:read"
      - "im:history"
      - "im:read"
      - "im:write"
      - "mpim:history"
      - "mpim:read"
      - "reactions:read"
      - "reactions:write"
      - "users:read"
      - "users:read.email"
      - "team:read"
settings:
  event_subscriptions:
    bot_events:
      - "app_mention"
      - "app_home_opened"
      - "message.channels"
      - "message.groups"
      - "message.im"
      - "message.mpim"
      - "member_joined_channel"
      - "member_left_channel"
      - "channel_left"
      - "group_left"
      - "channel_rename"
      - "channel_archive"
      - "channel_unarchive"
      - "channel_deleted"
      - "team_join"
      - "user_change"
      - "reaction_added"
      - "file_created"
      - "file_shared"
      - "file_change"
      - "assistant_thread_started"
      - "assistant_thread_context_changed"
      - "tokens_revoked"
      - "app_uninstalled"
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
