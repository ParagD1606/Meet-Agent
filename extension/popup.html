<!doctype html>
<html><head><meta charset="utf-8"><title>Brain Meeting Notes</title>
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #1b1b1d; color: #eee; } input { background: #2a2a2d; color: #eee; border-color: #444; } }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; margin: 8px 0 3px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #bbb; border-radius: 6px; }
  button { margin-top: 10px; padding: 6px 10px; border-radius: 6px; border: 0; background: #4f46e5; color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: inherit; border: 1px solid #888; margin-left: 6px; }
  #state, #last { margin-top: 10px; color: #777; }
  hr { border: 0; border-top: 1px solid #8884; margin: 12px 0; }
</style></head>
<body>
  <h1>Brain Meeting Notes</h1>
  <div id="state">Open a Meet, Teams or Zoom call and turn on captions.</div>
  <button id="send" hidden>Send transcript now</button>
  <div id="last"></div>
  <hr>
  <label for="server">Brain server URL</label>
  <input id="server" placeholder="https://brain.example.com" autocomplete="off">
  <label for="token">API token</label>
  <input id="token" type="password" placeholder="cbt_…" autocomplete="off">
  <button id="save">Save</button><button id="test" class="secondary">Test</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body></html>
